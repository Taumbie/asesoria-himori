# .github/workflows/deploy.yml
# Deploy automático a GitHub Pages en cada push a main.
# 1) Instala deps
# 2) Optimiza imágenes + comprime video
# 3) Build de Next.js (static export)
# 4) Sube el artefacto a Pages
#
# Configuración necesaria en GitHub:
#   Settings → Pages → Source: "GitHub Actions"

name: Deploy Himori landing to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite deploy manual desde la UI

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}/${{ github.event.repository.name }}
        # Solo `next build` — los assets optimizados (imágenes WebP, video MP4/WebM,
        # OG image) ya están commiteados en web/public/. Para regenerarlos desde
        # los originales, correr localmente: `npm run assets:regenerate`
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
